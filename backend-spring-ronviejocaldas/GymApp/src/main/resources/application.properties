# Application
spring.application.name=icesi-fit

# Base de datos.
# En Docker/PostgreSQL: DB_URL=jdbc:postgresql://db:5432/icesifit, DB_USERNAME=icesifit, DB_PASSWORD=...
# En desarrollo local usa H2 en memoria por defecto.
spring.datasource.url=${DB_URL:jdbc:h2:mem:icesifit}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate (el dialecto se detecta automáticamente según la URL)
spring.jpa.hibernate.ddl-auto=${DB_DDL_AUTO:create}
spring.jpa.show-sql=true
spring.jpa.defer-datasource-initialization=true

# SQL init
spring.sql.init.mode=always

# JWT
jwt.secret=${JWT_SECRET:icesifit-secret-key-super-segura-2024-jwt-token}
jwt.expiration=${JWT_EXPIRATION:86400000}

# CORS - origenes permitidos (separados por coma)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://10.147.20.70:8080}
