services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-icesifit}
      POSTGRES_USER: ${POSTGRES_USER:-icesifit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-icesifit123}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-icesifit} -d ${POSTGRES_DB:-icesifit}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - app-network

  backend:
    build:
      context: ./backend-spring-ronviejocaldas/GymApp
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-icesifit}
      DB_USERNAME: ${POSTGRES_USER:-icesifit}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-icesifit123}
      JWT_SECRET: ${JWT_SECRET:-icesifit-secret-key-super-segura-2024-jwt-token}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8081}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network

  frontend:
    build:
      context: ./frontend-react-ronviejocaldas
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8080/api}
        VITE_WS_URL: ${VITE_WS_URL:-http://localhost:8080/ws}
        VITE_BASE: ${VITE_BASE:-/}
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8081}:5173"
    depends_on:
      - backend
    networks:
      - app-network

volumes:
  db-data:

networks:
  app-network:
    driver: bridge
